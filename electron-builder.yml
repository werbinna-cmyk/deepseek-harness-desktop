appId: com.deepseek-ai.harness.desktop
productName: DeepSeek Harness
directories:
  output: dist
  buildResources: resources
# NOTE: electronDist is intentionally NOT set — electron-builder downloads the
# per-platform Electron zip it needs (cached under ~/Library/Caches/electron-builder),
# which is what makes the Windows cross-build from macOS work.
files:
  - main.js
  - lib/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  # The bundled dsh runtime snapshot (installed by scripts/prepare-runtime.mjs).
  # Seeded into the app data dir on first launch, where updates can then be
  # applied in place. Windows builds use runtime-win/ (paths.js picks the
  # subdirectory by platform).
  #
  # electron-builder hard-prunes a top-level `node_modules` directory in
  # extraResources (the filter rejects the first path segment "node_modules"),
  # so the tree is split: the runtime root first, then node_modules copied
  # with itself as the `from` root.
  - from: runtime
    to: runtime
    filter:
      - "**/*"
  - from: runtime/node_modules
    to: runtime/node_modules
    filter:
      - "**/*"
  - from: runtime-win
    to: runtime-win
    filter:
      - "**/*"
  - from: runtime-win/node_modules
    to: runtime-win/node_modules
    filter:
      - "**/*"
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"
dmg:
  title: DeepSeek Harness
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
npmRebuild: false
electronLanguages:
  - en
  - zh_CN
